name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Integration tests boot the real app against a throwaway Postgres database
    # (ApiFactory swaps the DB name to housecenter_test and recreates it).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Point straight at the test database. .NET config precedence lets this env var
      # win over the ApiFactory's in-memory override, so it must already name
      # housecenter_test — otherwise the seeder's EnsureDeleted would target whatever
      # DB is named here (e.g. "postgres", which can't drop itself: 55006).
      Database__ConnectionString: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=housecenter_test"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
