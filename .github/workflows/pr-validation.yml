name: PR Validation

# Enforces the issue-first workflow: every PR links an approved issue and
# carries exactly one type:* label. Mirrors the branch-pr skill's contract.
on:
  pull_request:
    types: [opened, edited, reopened, labeled, unlabeled, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    steps:
      - name: Body must reference an issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i;
            const m = body.match(re);
            if (!m) {
              core.setFailed(
                'PR body must link an issue with a closing keyword, e.g. "Closes #12".');
              return;
            }
            core.info(`Linked issue: #${m[1]}`);

  issue-approved:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    steps:
      - name: Linked issue must be approved
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const m = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!m) {
              core.setFailed('No linked issue to check for status:approved.');
              return;
            }
            const issue_number = parseInt(m[1], 10);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const labels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            if (!labels.includes('status:approved')) {
              core.setFailed(
                `Issue #${issue_number} must have the "status:approved" label ` +
                `before its PR can be merged (labels: ${labels.join(', ') || 'none'}).`);
              return;
            }
            core.info(`Issue #${issue_number} is approved.`);

  type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    steps:
      - name: Exactly one type:* label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || [])
              .map(l => l.name)
              .filter(n => n.startsWith('type:'));
            if (labels.length !== 1) {
              core.setFailed(
                `PR must have exactly one type:* label (found: ${labels.join(', ') || 'none'}).`);
              return;
            }
            core.info(`type label: ${labels[0]}`);
