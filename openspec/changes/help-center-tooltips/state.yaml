  backported into its own docs/skills). Ground truth is the real code: PatientsPage.tsx,
  ClinicsPage.tsx, PageHeader.tsx, Sidebar.tsx, NotificationBell.tsx — all plain @mui/material
  with onClick. Everything else in those 3 skills (four-layer pattern, @/ alias, named
  exports, query-key factory, RBAC guards, no test runner) IS still accurate.
  Sidebar nav wiring is a 3-file touch (constants.ts NAV_ITEMS + Sidebar.tsx bucket array
  CORE_PATHS/etc. + Sidebar.tsx NAV_ICONS map), not a 1-line NAV_ITEMS push — items outside
  a bucket array silently don't render. Icon.tsx's paths map is dead legacy code (1 consumer);
  use @mui/icons-material's HelpOutlineOutlined instead. Base API client is src/api/client.ts.
  Backend HelpTopic.Body is already-seeded real Markdown (not HTML) — a markdown renderer is
  required; evaluate markdown-to-jsx as a lighter alternative to react-markdown in propose.
  No test runner in this frontend — verification is `pnpm build` + `pnpm lint` only.
  PageHeader.tsx safe to extend with an additive helpKey? prop (13 consumers, closed Props
