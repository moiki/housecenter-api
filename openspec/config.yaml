schema: spec-driven

context: |
  Tech stack: .NET 10, ASP.NET Core Minimal API, EF Core 10 + Npgsql, MediatR 12.5.0
  Architecture: vertical slices (Features/); CQRS by default for new modules, Service pattern for transactional coordination
  Testing: xUnit + FluentAssertions + WebApplicationFactory (integration) + EF InMemory (unit)
  Style: Result Pattern + ProblemDetails (RFC 9457), FluentValidation, Serilog structured logging, JWT auth (4 secrets)

strict_tdd: true

testing:
  test_runner:
    command: dotnet test
    framework: xUnit
  layers:
    unit:
      available: true
      tool: xUnit + EF Core InMemory provider
    integration:
      available: true
      tool: Microsoft.AspNetCore.Mvc.Testing (WebApplicationFactory) — ApiFactory.cs, real Postgres test DB (housecenter_test)
    e2e:
      available: false
      tool: null
  coverage:
    available: true
    command: dotnet test --collect:"XPlat Code Coverage" (coverlet.collector)
  quality:
    linter: null
    type_checker: dotnet build (Roslyn compiler + nullable reference types enabled)
    formatter: null

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
